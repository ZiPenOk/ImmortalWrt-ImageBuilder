name: Build 24.10.x x86-64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "24.10.6"
        type: choice
        options:
          - 24.10.0
          - 24.10.1
          - 24.10.2
          - 24.10.3
          - 24.10.4
          - 24.10.5
          - 24.10.6
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口路由器有效)，例如 10.10.10.10"
        required: true
        default: "10.10.10.10"
      profile:
        description: '请输入要编译固件大小 单位(MB)'
        required: true
        default: '1024'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'yes'
        type: choice
        options:
        - 'yes'
        - 'no'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PPPOE_ACCOUNT: ${{ secrets.IMM_PPPOE_ACCOUNT }}
      PPPOE_PASSWORD: ${{ secrets.IMM_PPPOE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build24.sh

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${{ github.event.inputs.custom_router_ip }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "$PPPOE_ACCOUNT" || -z "$PPPOE_PASSWORD" ]]; then
              echo "Error: IMM_PPPOE_ACCOUNT and IMM_PPPOE_PASSWORD secrets must be set when PPPoE is enabled!"
              exit 1
            fi
          fi
      
      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Build ImmortalWrt-x86-64-efi 24.10.x
        run: |
          profile="${{ github.event.inputs.profile }}"
          include_docker="${{ github.event.inputs.include_docker }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          update_version="$(date +%s)"
          release_tag="a$(date -u +%Y%m%d%H%M%S)"
          update_tag="Update-x86-64-24.10"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          echo "UPDATE_TAG=$update_tag" >> "$GITHUB_ENV"
          echo "Building for profile: $profile"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/custom" \
            -v "${{ github.workspace }}/x86-64/imm.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build24.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$profile \
            -e INCLUDE_DOCKER=$include_docker \
            -e PROJECT_UPDATE_VERSION=$update_version \
            -e PROJECT_LUCI_EDITION=24.10 \
            -e PROJECT_UPDATE_TAG=$update_tag \
            -e PROJECT_GITHUB_LINK=https://github.com/${{ github.repository }} \
            -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            -e "PPPOE_ACCOUNT=$PPPOE_ACCOUNT" \
            -e "PPPOE_PASSWORD=$PPPOE_PASSWORD" \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh

      - name: Fix firmware output ownership
        run: sudo chown -R "$(id -u):$(id -g)" "${{ github.workspace }}/bin"

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
           <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            extra_content="#### 默认带docker"
            echo -e "\n$extra_content" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Create firmware checksum
        run: |
          find "${{ github.workspace }}/bin/targets/x86/64" "${{ github.workspace }}/bin/update" -type f -name '*.img.gz' -print0 |
            while IFS= read -r -d '' image; do
              (cd "$(dirname "$image")" && sha256sum "$(basename "$image")" > "$(basename "$image").sha256")
            done

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Immortalwrt-24.10-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*.img.gz*
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old AutoUpdate assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_TAG: ${{ env.UPDATE_TAG }}
        run: bash shell/clean-autoupdate-assets.sh

      - name: Upload AutoUpdate firmware assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.UPDATE_TAG }}
          name: AutoUpdate-x86-64-24.10
          make_latest: false
          files: |
            ${{ github.workspace }}/bin/update/*.img.gz*
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish update metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 2 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ env.UPDATE_TAG }}" \
            -o zzz_api
          test -s zzz_api
          jq -e '.assets | type == "array"' zzz_api >/dev/null

      - name: Upload update metadata
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.UPDATE_TAG }}
          make_latest: false
          files: zzz_api
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
